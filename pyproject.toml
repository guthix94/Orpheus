[project]
name = "orpheus"
version = "0.1.0"
description = "Intelligent lesson documentation system for music educators"
requires-python = ">=3.11"
dependencies = [
    # API server
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.9",

    # Database
    "sqlalchemy[asyncio]>=2.0.25",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "alembic>=1.13.0",

    # Task queue
    "celery[redis]>=5.3.6",
    "redis>=5.0.0",

    # Audio analysis
    "imageio-ffmpeg>=0.4.9",
    "librosa>=0.10.1",
    "soundfile>=0.12.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",

    # Silero VAD (CPU-only inference — no GPU/CUDA needed)
    # Install from CPU index via requirements.txt --extra-index-url
    "torch>=2.1.0",

    # Speech-to-text (Groq-hosted Whisper)
    "groq>=0.4.0",

    # Music score parsing
    "music21>=9.1.0",

    # NLP / entity extraction
    "rapidfuzz>=3.6.0",

    # LLM
    "anthropic>=0.40.0",

    # Config
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",

    # Auth (Supabase JWT verification)
    "PyJWT[crypto]>=2.8.0",
    "httpx>=0.26.0",

    # Email
    "sendgrid>=6.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.26.0",
    "ruff>=0.2.0",
    "mypy>=1.8.0",
]
madmom = [
    "madmom>=0.16.1",
]

[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.setuptools.packages.find]
include = ["server*", "processing*", "scores*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
